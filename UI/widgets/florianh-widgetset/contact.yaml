uid: contact
tags:
  - florianh-widgetset
props:
  parameters:
    - description: Small title on top of the card
      label: Title
      name: title
      required: false
      type: TEXT
      groupName: appearance
    - description: Header big sized
      label: Header
      name: header
      required: false
      type: TEXT
      groupName: appearance
    - description: Icon on top of the card (only f7 icons (without f7:)), e.g square
      label: Icon
      name: icon
      required: false
      type: TEXT
      groupName: appearance
    - description: HEX or rgba
      label: Background Color
      name: bgcolor
      required: false
      type: TEXT
      groupName: appearance
    - context: item
      description: Item whose state to display
      label: Item
      name: item
      required: true
      type: TEXT
      groupName: widgetSettings
    - default: window
      description: Big icon shown in the upper right corner for state representation
      label: Big openHAB Icon
      name: bigOhIcon
      required: false
      type: TEXT
      groupName: widgetSettings
  parameterGroups:
    - name: appearance
      label: Appearance settings
    - name: widgetAction
      context: action
      label: Action settings
      description: Action to perform when the widget is clicked
    - name: widgetSettings
      label: Widget settings
timestamp: Dec 4, 2025, 1:54:45 AM
component: f7-card
config:
  style:
    background-color: "=props.bgcolor || (themeOptions.dark === 'dark' ? 'rgba(28, 28, 30, 0.85)' : 'rgba(255, 255, 255, 0.85)')"
    backdrop-filter: blur(6px)
    border-radius: var(--f7-card-expandable-border-radius)
    border: 1px solid var(--f7-card-border-color, rgba(0,0,0,0.06))
    box-shadow: var(--f7-card-box-shadow, 0px 4px 12px rgba(0,0,0,0.05))
    height: 120px
    margin-left: 5px
    margin-right: 5px
    minWidth: 200px
slots:
  content:
    - component: f7-block
      config:
        visible: "=props.title || props.icon ? true : false"
        style:
          display: flex
          flex-direction: row
          left: 16px
          position: absolute
          top: -5px
      slots:
        default:
          - component: f7-icon
            config:
              f7: =props.icon || 'square'
              size: 18
              style:
                margin-right: 10px
          - component: Label
            config:
              style:
                font-size: 12px
                margin-top: 0px
              text: =props.title
    - component: f7-block
      config:
        style:
          display: flex
          flex-direction: column
          left: 17px
          position: absolute
          top: "=props.title || props.icon ? '45px' : '-5px'"
          width: 100%
      slots:
        default:
          - component: Label
            config:
              style:
                font-size: 22px
                font-weight: 500
                overflow: hidden
                text-overflow: ellipsis
                white-space: nowrap
                width: "=props.bigOhIcon ? 'calc(100% - 90px)' : '100%'"
              text: =props.header || 'Set header!'
          - component: Label
            config:
              style:
                color: "=@@[props.item] === 'CLOSED' || #[props.item] === 0 ? (themeOptions.dark === 'dark' ? '#30d158' : '#34c759') 
                  : #[props.item] === 0.3 ? (themeOptions.dark === 'dark' ? '#ffd60a' : '#ffcc00') 
                  : #[props.item] === 0.5 ? (themeOptions.dark === 'dark' ? '#ff9f0a' : '#ff9500') 
                  : (themeOptions.dark === 'dark' ? '#ff453a' : '#ff3b30')"
                font-size: 16px
                font-weight: 400
                margin-top: -0.25em
                overflow: hidden
                text-overflow: ellipsis
                white-space: nowrap
                width: "=props.bigOhIcon ? 'calc(100% - 90px)' : '100%'"
              text: =@props.item
    - component: oh-icon
      config:
        icon: "=items[props.item].state === 'CLOSED' || #props.item === 0 
          ? props.bigOhIcon + '-closed' 
          : props.bigOhIcon + '-open'"
        style:
          position: absolute
          right: 10px
          top: 5px
          width: 90px
        visible: "=props.bigOhIcon ? true : false"
    - component: oh-link
      config:
        actionPropsParameterGroup: widgetAction
        style:
          height: 120px
          left: 0px
          position: absolute
          top: 0px
          width: 100%
        visible: "=props.widget_action ? true : false"
