# description: Doorbell event widget that displays the image and the timestamp from a last event of a given type
# note: This widget is required by the "doorbellPageWidget"
# author: Copyright (c) 2022 Florian Hotze under MIT License
uid: doorbellEvent
tags:
  - doorbell
  - florianh-widgetset
props:
  parameters:
    - label: Event description
      name: eventDescription
      required: false
      type: TEXT
      groupName: widgetSettings
    - context: item
      description: Image Item that holds the last event image
      label: Event image Item
      name: item_eventImage
      required: true
      type: TEXT
      groupName: widgetSettings
    - context: item
      description: DateTime Item that holds the timestamp when the last event occured
      label: Event timestamp Item
      name: item_eventTimestamp
      required: true
      type: TEXT
      groupName: widgetSettings
  parameterGroups:
    - name: widgetSettings
      label: Widget settings
component: div
config:
  style:
    display: flex
    justify-content: center
    width: 100%
  stylesheet: |
    .oh-image {
      border-radius: var(--f7-card-expandable-border-radius);
    }
slots:
  default:
    - component: oh-image-card
      config:
        footer: "=props.eventDescription ? props.eventDescription + ': ' + items[props.item_eventTimestamp].displayState : items[props.item_eventTimestamp].displayState"
        item: =props.item_eventImage
        lazy: true
        style:
          --view-area-height: calc(100dvh - var(--f7-navbar-height) - var(--f7-safe-area-top))
          border: 1px solid var(--f7-card-border-color, rgba(0,0,0,0.06))
          border-radius: var(--f7-card-expandable-border-radius)
          box-shadow: var(--f7-card-box-shadow, 0px 4px 12px rgba(0,0,0,0.05))
          footer-font-size: 24px
          max-height: calc(var(--view-area-height) - 2*var(--f7-card-margin-vertical))
          max-width: ='calc((' + screen.viewAreaHeight + 'px - 2*var(--f7-block-padding-vertical)) * (4/3))'
          overflow: hidden
          text-align: center
